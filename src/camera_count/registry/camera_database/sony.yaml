# Sony
#
# Models are added only with a citation for the exact-count method.
manufacturer: Sony
manufacturer_aliases:
  - SONY
  - Sony Corporation
usb_vendor_ids:
  - id: 0x054c
    citation:
      kind: url
      reference: http://www.linux-usb.org/usb.ids
      note: 'usb.ids vendor entry: "054c  Sony Corp." (retrieved 2026-09-16)'
notes: >-
  ExifTool defines several Sony ShutterCount tags, but they are
  model-conditional and the source marks some of them as valid only for
  certain models - see exiftool/lib/Image/ExifTool/Sony.pm:3339, :3483,
  :3490 and the Tag9050a/b/c tables from :7644. Registering them needs
  per-model work, so Sony bodies currently report the count as unavailable
  rather than risk reporting the wrong number.
models: []
