# Canon
#
# Canon stores its actuation counter in model-specific CameraInfo tables, so
# entries here are per model. The model strings are the ones ExifTool matches on
# to choose each table, which are the strings the camera writes to EXIF Model.
#
# Deliberately NOT registered:
#   * EOS-1D Mark III (CameraInfo1DmkIII tag 0x176). The source notes the value
#     "may be valid only for some 1DmkIII copies, even running the same
#     firmware". A number that may or may not be the count does not meet this
#     project's bar, so this model reports NOT AVAILABLE.
#   * PowerShot G5 X Mark II. Its table defines two separate ShutterCount tags,
#     and which one applies is not resolved here.
#   * EOS-1D / 1Ds / 1D Mark II family (FileInfo). Selection depends on byte
#     order and model conditions that need per-body verification first.
manufacturer: Canon
manufacturer_aliases:
  - Canon Inc.
  - CANON
usb_vendor_ids:
  - id: 0x04a9
    citation:
      kind: url
      reference: http://www.linux-usb.org/usb.ids
      note: 'usb.ids vendor entry: "04a9  Canon, Inc." (retrieved 2026-09-16)'
models:
  - model: Canon EOS R5
    aliases:
      - EOS R5
    exact_count_available: true
    methods:
      - type: makernote_field
        identifier: Canon:ShutterCount
        count_type: total_releases
        verification_status: documented
        citation:
          kind: source_ref
          reference: exiftool/lib/Image/ExifTool/Canon.pm:4834
          note: >-
            CameraInfoR6 table, tag 0x0af1 ShutterCount, int32u, noted as
            including electronic and mechanical shutter. The table is selected
            for models matching "EOS R5" or "EOS R6" (Canon.pm:1446-1448).
    limitations:
      - >-
        The counter covers electronic and mechanical actuations together, so it
        is reported as a total rather than as a mechanical count.

