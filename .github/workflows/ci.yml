name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  quality:
    name: Lint, types and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ExifTool
        run: choco install exiftool --no-progress -y

      - name: Create environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      # The sample camera files that ship with the ExifTool distribution are
      # what the integration tests run against. Without them those tests skip,
      # and the identifiers in the registry go unchecked against real files.
      - name: Fetch the ExifTool sample images
        run: uv run python scripts/fetch_exiftool.py --mode source

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests with coverage
        run: uv run pytest --cov=camera_count --cov-report=term-missing --cov-report=xml

      - name: Core coverage gate
        run: uv run python scripts/check_coverage.py coverage.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  registry:
    name: Registry schema and generated docs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Validate every registry entry against the schema
        run: uv run camera-count supported --json > $env:TEMP/supported.json

      - name: Regenerate manufacturer support docs and fail on drift
        run: |
          uv run python scripts/generate_support_docs.py
          git diff --exit-code docs/manufacturer-support.md

  packaging:
    name: Package for Windows
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Vendor ExifTool (checksum-pinned)
        run: uv run python scripts/fetch_exiftool.py

      - name: Generate third-party licence inventory
        run: uv run python scripts/generate_third_party_licenses.py

      - name: Build the one-folder distribution
        run: uv run python packaging/build.py

      - name: Verify the release ships no mock code and needs no Python
        run: uv run python packaging/verify_release.py

      # Not a release gate here: if the runner has no Inno Setup, CI still
      # proves the distribution builds. The release workflow requires it.
      - name: Build the installer
        run: uv run python packaging/build_installer.py --optional

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: camera-count-tool-windows
          path: packaging/output/
          if-no-files-found: error
