name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  quality:
    name: Lint and types (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libusb-1.0-0 exiftool

      - name: Install ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool --no-progress -y

      - name: Create environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests with coverage
        run: uv run pytest --cov=camera_count --cov-report=term-missing --cov-report=xml

      - name: Core coverage gate
        run: uv run python scripts/check_coverage.py coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  registry:
    name: Registry schema and generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Validate every registry entry against the schema
        run: uv run camera-count supported --json > /dev/null

      - name: Regenerate manufacturer support docs and fail on drift
        run: |
          uv run python scripts/generate_support_docs.py
          git diff --exit-code docs/manufacturer-support.md

  packaging:
    name: Package (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfuse2 libusb-1.0-0

      - name: Create environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Vendor ExifTool (checksum-pinned)
        run: uv run python scripts/fetch_exiftool.py

      - name: Build one-folder distribution
        run: uv run python packaging/build.py

      - name: Verify the release contains no mock code and no Python requirement
        run: uv run python packaging/verify_release.py

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: camera-count-tool-${{ matrix.os }}
          path: packaging/output/
          if-no-files-found: error
