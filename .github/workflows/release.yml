name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a dry run)"
        required: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  release:
    name: Build and publish the Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      # A release must never be built from code that does not pass its own
      # checks, so the whole suite runs here again rather than trusting CI.
      - name: Lint, types and tests
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q

      - name: Vendor ExifTool (checksum-pinned)
        run: uv run python scripts/fetch_exiftool.py

      - name: Generate third-party licence inventory
        run: uv run python scripts/generate_third_party_licenses.py

      - name: Build the distribution
        run: uv run python packaging/build.py

      - name: Verify the release
        run: uv run python packaging/verify_release.py

      - name: Build the installer
        run: uv run python packaging/build_installer.py

      - name: Show what will be published
        run: |
          Get-ChildItem packaging/output -File | Select-Object Name, Length
          Get-Content packaging/output/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camera-count-tool-windows
          path: |
            packaging/output/*.zip
            packaging/output/*.exe
            packaging/output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            packaging/output/*.zip
            packaging/output/*.exe
            packaging/output/SHA256SUMS.txt
          body: |
            Windows 10/11 x64.

            Verify your download against `SHA256SUMS.txt` before running it.
            These builds are not code-signed, so SmartScreen will warn on first
            run: choose **More info -> Run anyway** once you have checked the
            hash.

            Camera Count Tool reports a shutter count only when it can obtain
            that count from an authoritative source. When an exact count cannot
            be obtained, it reports the count as unavailable rather than
            estimating it.
