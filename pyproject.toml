[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camera-count-tool"
version = "0.1.0"
description = "Reads the exact shutter/actuation count of a camera from authoritative sources, or reports it as unavailable. Never estimates."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Camera Count Tool contributors" }]
keywords = ["camera", "shutter count", "actuation count", "ptp", "exif", "used camera"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
]
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "platformdirs>=4.2",
    "comtypes>=1.4.1",
    "PySide6-Essentials>=6.7",
]

[project.optional-dependencies]
# Optional: only for users who have installed a WinUSB/libusb driver for their
# camera themselves. This program never installs or replaces a driver.
winusb = [
    "pyusb>=1.2.1",
    "libusb-package>=1.0.26.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pyinstaller>=6.8",
    "pip-licenses>=4.4",
]

[project.scripts]
camera-count = "camera_count.cli.main:run"

[project.gui-scripts]
camera-count-gui = "camera_count.gui.main:run"

[project.urls]
Homepage = "https://github.com/Osama01Anwar/camera-count-tool"
Source = "https://github.com/Osama01Anwar/camera-count-tool"
Issues = "https://github.com/Osama01Anwar/camera-count-tool/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_count"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "packaging/", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "S", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# The COM type libraries comtypes generates are named by Windows, not by us.
"src/camera_count/wpd/session.py" = ["N813"]
"tests/**" = ["S", "ARG", "N"]
"packaging/**" = ["S"]
# Generated Markdown tables cannot be wrapped without changing the output.
"scripts/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/camera_count"]
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "camera_count.core.*",
    "camera_count.ptp.*",
    "camera_count.adapters.*",
    "camera_count.registry.*",
    "camera_count.metadata.*",
]
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hardware: requires a physically connected camera (skipped by default)",
    "gui: requires a Qt display environment",
]

[tool.coverage.run]
branch = true
source = ["camera_count"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
